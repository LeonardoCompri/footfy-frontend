name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Rodar testes
        run: npm test

      - name: Build (inclui checagem de tipos)
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker:
    name: Imagem Docker do web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem (sem push)
        run: docker build -f infra/docker/web/Dockerfile --build-arg BASE_PATH=/footfy/ -t footfy/web:ci .

  deploy:
    name: Deploy no servidor
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, footfy-server]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      FOOTFY_SERVER_DIR: ${{ vars.FOOTFY_SERVER_DIR }}
    steps:
      - name: Deploy do frontend
        run: |
          DIR="$FOOTFY_SERVER_DIR"
          if [ -z "$DIR" ]; then
            if [ "$DEPLOY_ENV" = production ]; then
              DIR="$HOME/analitix/footfy"
            else
              echo "FOOTFY_SERVER_DIR não definida no environment $DEPLOY_ENV"
              exit 1
            fi
          fi
          "$DIR/deploy.sh" frontend
